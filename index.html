<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="lib.css" />
    <script src="lib.js" defer></script>
  </head>
  <body>
    <main id="main-page">
      <article id="book-library">
        <section id="books"></section>
        <section id="controls">
          <button
            role="button"
            class="btn"
            data-button="open-dialog"
            id="open-dialog"
            aria-label="add a book"
          >
            add book
          </button>
        </section>
      </article>
    </main>
    <dialog id="dialog-box">
      <form id="selection-form">
        <fieldset class="fields">
          <legend>book details</legend>

          <div class="field">
            <label for="book-title">Title</label>
            <input type="text" id="book-title" name="title" autofocus>
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input type="text" name="author" id="author">
          </div>

          <div class="field">
            <label for="pages">Number of pages</label>
            <input type="number" name="pages" id="pages" min="30">
          </div>
        </fieldset>
        <div class="dropdown-wrapper">
          <label for="genre-select">Genre</label>
          <div class="dropdown-menue">
            <button value="" name="genre" id="genre-select-btn">
              <input readonly type="text" id="selection"></input>
              <span class="dropdown-icon">▼</span>
            </button>
            <ul class="list">
              <li data-genre="fantasy">fantasy</li>
              <li data-genre="crime">crime</li>
              <li data-genre="science">science</li>
              <li data-genre="self help">self help</li>
            </ul>
          </div>
        </div>
        <div class="form-buttons">
          <button id="submit-button" class="btn" data-button="submit-book">
            add book
          </button>
          <button
            class="btn"
            role="button"
            id="cancel-button"
            data-button="cancel"
          >
            cancel
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
