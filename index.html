<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="lib.css" />
    <script src="lib.js" defer></script>
  </head>
  <body>
    <main id="main-page">
      <article id="book-library">
        <section id="books">
          <div class="book-container">
            <div class="book">
              <h3 class="book-title">lord of the rings</h3>
              <p class="info">by: tolkin</p>
              <p class="info">pages: 4699</p>
              <p class="info">genre: fantasy</p>
            </div>
            <button
              class="btn remove-book-button"
              id="remove-book-button"
              data-button="remove-book"
            >
              X
            </button>
            <div class="book-controls">
              <button class="btn read" id="read" data-button="read">
                read
              </button>
            </div>
          </div>
         
      
            </div>
          </div>
        </section>
        <section id="controls">
          <button
            role="button"
            class="btn"
            data-button="open-dialog"
            id="open-dialog"
            aria-label="add a book"
          >
            add book
          </button>
        </section>
      </article>
    </main>
    <dialog id="dialog-box" closedby="any">
      <form id="selection-form" >
        <fieldset class="fields">
          <legend>book details</legend>

          <div class="field">
            <label for="book-title">Title</label>
            <input type="text" id="book-title" name="title" autofocus />
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input type="text" name="author" id="author" />
          </div>

          <div class="field">
            <label for="pages">Number of pages</label>
            <input type="number" name="pages" id="pages" min="30" />
          </div>
        </fieldset>
        <div class="dropdown-wrapper">
          <label for="genre-select">Genre</label>
          <div class="dropdown-menue">
            <button name="genre" id="genre-select-btn">
              <p id="selection"></p>
              <span class="dropdown-icon">▼</span>
            </button>
            <ul class="list">
              <li data-genre="fantasy">fantasy</li>
              <li data-genre="crime">crime</li>
              <li data-genre="science">science</li>
              <li data-genre="self help">self help</li>
            </ul>
          </div>
        </div>
        <div class="form-buttons">
          <button id="submit-button" class="btn" data-button="submit-book">
            add book
          </button>
          <button class="btn" role="button" id="cancel-button" data-button="cancel">
            cancel
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
