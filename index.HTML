<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="lib.css" />
    <script src="lib.js" defer></script>
  </head>
  <body>
    <main>
      <article id="book-library">
        <section id="books">
          <div class="book">
            <p>title:lord of the rings</p>
            <p>author: tolkin</p>
            <p>pages: 4699</p>
            <p>genre</p>
          </div>
          <div class="book">book</div>
          <div class="book">book</div>
          <div class="book">book</div>
          <!-- <button class="btn" id="remove-book-button" data-button="remove-book">
            remove book
          </button>
          <button class="btn" id="read-status" data-button="read">read</button> -->
          <div class="book">book</div>
          <div class="book">book</div>
          <div class="book">book</div>
          <div class="book">book</div>
          <div class="book">book</div>
          <div class="book">book</div>
        </section>
        <section id="controls">
          <button
            role="button"
            class="btn"
            data-button="open-dialog"
            id="open-dialog"
            aria-label="add a book"
          >
            add book
          </button>
        </section>
      </article>
    </main>
    <dialog id="dialog-box">
      <form id="selection-form">
        <fieldset class="fields">
          <legend>add book details</legend>

          <div class="field">
            <label for="book-title">Title</label>
            <input type="text" id="book-title" name="title" autofocus />
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input type="text" name="author" id="author" />
          </div>

          <div class="field">
            <label for="pages">Number of pages</label>
            <input type="number" name="pages" id="pages" min="30" />
          </div>
        </fieldset>
        <div class="dropdown-menue">
          <label for="genre-select">Genre</label>
          <select name="genre" id="genre-select">
            <option value="fantasy">fantasy</option>
            <option value="crime">crime</option>
            <option value="science">science</option>
            <option value="self-help">self help</option>
          </select>
        </div>
        <div class="form-buttons">
          <button id="submit-button" class="btn" data-button="submit-book">
            add book
          </button>
          <button class="btn" id="cancel-button" data-button="cancel">
            cancel
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
